{{- if .Values.ingress.enabled }}
{{- $host := required "ingress.host is required when ingress.enabled" .Values.ingress.host }}
{{- $hosts := concat (list $host) .Values.ingress.extraHosts }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ofpr-info.fullname" . }}
  labels:
    {{- include "ofpr-info.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer | quote }}
    {{- end }}
    {{- range $key, $value := .Values.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        {{- range $hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ include "ofpr-info.tlsSecretName" . }}
  rules:
    {{- range $hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ofpr-info.fullname" $ }}
                port:
                  name: http
    {{- end }}
{{- end }}
