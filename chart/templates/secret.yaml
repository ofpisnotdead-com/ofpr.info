{{- $password := required "postgres.password is required" .Values.postgres.password -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ofpr-info.secretName" . }}
  labels:
    {{- include "ofpr-info.labels" . | nindent 4 }}
type: Opaque
stringData:
  # One secret for both: postgres reads the password, the app reads the url built from
  # it, so the password is written down once.
  POSTGRES_PASSWORD: {{ $password | quote }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s:5432/%s" .Values.postgres.username $password (include "ofpr-info.postgresHost" .) .Values.postgres.database | quote }}
