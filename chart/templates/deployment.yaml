apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ofpr-info.fullname" . }}
  labels:
    {{- include "ofpr-info.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Nothing is held here - postgres has all of it - so new pods come up before the old
  # ones go, and a deploy costs nothing.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "ofpr-info.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "ofpr-info.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 9292
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ofpr-info.secretName" . }}
                  key: DATABASE_URL
            - name: CDN_BASE
              value: {{ .Values.cdnBase | quote }}
            - name: HOSTED_BASE
              value: {{ .Values.hostedBase | quote }}
            {{- range $site, $backend := .Values.hosted }}
            - name: HOSTED_{{ upper $site }}
              value: {{ $backend | quote }}
            {{- end }}
          # /healthz answers without touching postgres, so a pod with no database still
          # reports honestly rather than being restarted in a loop.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # The root filesystem is read only; puma wants somewhere to write.
        - name: tmp
          emptyDir: {}
