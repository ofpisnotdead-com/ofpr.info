apiVersion: v1
kind: Service
metadata:
  name: {{ include "ofpr-info.fullname" . }}
  labels:
    {{- include "ofpr-info.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "ofpr-info.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
