name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ofpr
          POSTGRES_PASSWORD: ofpr
          POSTGRES_DB: ofpr_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ofpr"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://ofpr:ofpr@localhost:5433/ofpr_test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec rubocop
      - run: bundle exec rspec
      - run: bundle exec bundle-audit check --update
