name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.backend }})
    strategy:
      fail-fast: false
      matrix:
        backend: [bundler, native]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ofpr
          POSTGRES_PASSWORD: ofpr
          POSTGRES_DB: ofpr_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ofpr"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      GH_TOKEN: ${{ github.token }}
      BUNDLE_FROZEN: 'true'
      DATABASE_URL: postgres://ofpr:ofpr@localhost:5433/ofpr_test
    steps:
      - uses: actions/checkout@v7
      - uses: RubyElders/rb-setup@v0.4.3
        id: setup
        with:
          sync: true
          cache-ruby: true
          package-backend: ${{ matrix.backend }}
      - name: Report cache hits
        run: |
          echo "Ruby cache hit: ${{ steps.setup.outputs.ruby-cache-hit }}"
          echo "Dependency cache hit: ${{ steps.setup.outputs.dependency-cache-hit }}"
      - run: rb run lint
      - run: rb run test
      - run: rb run audit
      - run: git diff --exit-code -- Gemfile.lock
