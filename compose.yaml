services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ofpr
      POSTGRES_PASSWORD: ofpr
      POSTGRES_DB: ofpr_development
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ofpr -d ofpr_development']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
